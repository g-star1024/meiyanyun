<style>
  :root {

    --text-soft: #8a92a3;
    --accent: #ff6b9e;
    --accent-soft: #fff0f6;

    --danger-soft: #fff0f2;

    -webkit-font-smoothing: antialiased;

  .wrap { max-width: 1440px; margin: 0 auto; }

  .page-head { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .page-head .logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), #6b8aff); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; box-shadow: 0 6px 16px rgba(255, 107, 158, .35); }
  .page-head h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .page-head p { color: var(--text-soft); font-size: 13px; margin-top: 2px; }

  .tabs { display: inline-flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 22px; box-shadow: var(--shadow); }
  .tab { padding: 8px 18px; cursor: pointer; color: var(--text-soft); font-weight: 500; border-radius: 9px; transition: all .18s ease; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); background: var(--accent-soft); }

  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 18px 12px 20px; box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, box-shadow .18s ease; }
  .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .85; }
  .stat:nth-child(2)::before { background: #0fbf8f; }
  .stat:nth-child(3)::before { background: #f7a234; }
  .stat:nth-child(4)::before { background: #7a5af5; }
  .stat:nth-child(5)::before { background: #8a92a3; }
  .stat .label { color: var(--text-soft); font-size: 12px; margin-bottom: 4px; }
  .stat .value { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; cursor: pointer; font-weight: 600; box-shadow: 0 4px 12px rgba(255, 107, 158, .28); transition: transform .12s ease, box-shadow .18s ease, filter .18s ease; }
  .btn:hover { filter: brightness(1.05); box-shadow: 0 6px 18px rgba(255, 107, 158, .36); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--surface); color: var(--text-soft); border: 1px solid var(--border-strong); box-shadow: none; font-weight: 500; }
  .btn.ghost:hover { color: var(--text); filter: none; }
  .spacer { flex: 1; }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-soft); pointer-events: none; }
  .search-box input { padding-left: 32px; }
  input, select { font-family: var(--font); font-size: 14px; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 11px; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s ease, box-shadow .15s ease; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th { background: #fafbfd; color: var(--text-soft); font-weight: 600; font-size: 12px; letter-spacing: .03em; }
  tbody tr { transition: background .12s ease; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--accent-soft); }
  td.name { font-weight: 600; cursor: pointer; white-space: normal; min-width: 280px; }
  td.name:hover { color: var(--accent); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
  .col-actions { width: 56px; text-align: center; }
  .icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: none; background: transparent; color: var(--text-soft); cursor: pointer; opacity: 0; transition: all .15s ease; }
  tbody tr:hover .icon-btn { opacity: 1; }
  .icon-btn:hover { background: var(--danger-soft); color: var(--danger); }

  .board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 16px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: rgba(255,255,255,.7); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; backdrop-filter: blur(4px); }
  .col h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
  .col h3 .count { color: var(--text-soft); font-weight: 500; background: var(--bg); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  .col-body { min-height: 40px; display: flex; flex-direction: column; gap: 10px; }
  .ticket { position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 14px; cursor: grab; background: var(--surface); box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .18s ease; }
  .ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
  .ticket.dragging { opacity: .4; }
  .ticket .t-name { font-weight: 600; margin-bottom: 10px; padding-right: 22px; font-size: 13px; line-height: 1.5; }
  .ticket .t-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--text-soft); font-size: 12px; }
  .ticket .t-del { position: absolute; top: 8px; right: 8px; }
  .ticket:hover .t-del { opacity: 1; }
  .col.drop-hover { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }

  .hidden { display: none; }

  .overlay { position: fixed; inset: 0; background: rgba(20, 24, 40, .34); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; animation: fade .16s ease; }
  @keyframes fade { from { opacity: 0; } }
  .modal { background: var(--surface); border-radius: 18px; padding: 26px; width: 460px; max-width: 90vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(20, 24, 40, .28); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  .modal h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal .sub { color: var(--text-soft); font-size: 13px; margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; color: var(--text-soft); font-size: 13px; margin-bottom: 6px; }
  .field input, .field select { width: 100%; }
  .modal-actions { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
  .btn.danger { background: var(--danger); box-shadow: 0 4px 12px rgba(245, 69, 92, .28); }
  .link-danger { color: var(--danger); cursor: pointer; background: none; border: none; font-size: 14px; font-weight: 500; padding: 8px 10px; border-radius: 8px; }
  .link-danger:hover { background: var(--danger-soft); }
</style>
</head>

    </div>
    <div class="spacer"></div>

</div>

    { id: 24, name: "安全加固收口：手机号脱敏已落地（2026-09-02 M7）；全站扫描确认无身份证/银行卡字段（支付方式为枚举无卡号），脱敏扩面无剩余标的；审计 actor JWT 收敛+哈希链防篡改已完成；遗留：操作日志/登录日志查询页（M1AuditLogView）接 audit-service 查询 API 去 mock，列 M5 前端批次", status: "doing", priority: "P1", line: "安全", owner: "全栈", milestone: "M7", created: "2026-08-25" },
    { id: 25, name: "测试体系：后端 JUnit5+Mockito 单测、接口自动化（pytest/Newman）、Playwright E2E 核心流程回归", status: "todo", priority: "P2", line: "质量保障", owner: "测试", milestone: "M5", created: "2026-08-25" },
    { id: 26, name: "CI/CD 流水线补强：现有 ci.yml 仅编译/类型检查，补镜像构建推送、一键部署、回滚脚本", status: "todo", priority: "P2", line: "基础设施", owner: "DevOps", milestone: "M6", created: "2026-08-25" },
    { id: 27, name: "监控告警：Prometheus + Grafana 指标、ELK 日志收集、钉钉/企微告警", status: "todo", priority: "P2", line: "基础设施", owner: "DevOps", milestone: "M6", created: "2026-08-25" },
    { id: 28, name: "生产部署编排：K8s YAML / docker-compose 生产配置、PG 备份策略、零停机滚动发布", status: "todo", priority: "P2", line: "基础设施", owner: "DevOps", milestone: "M6", created: "2026-08-25" },
    { id: 29, name: "性能优化：慢查询/索引、Redis 热点缓存、HikariCP 调优、前端路由级分包/懒加载/首屏骨架屏", status: "todo", priority: "P3", line: "平台底座", owner: "全栈", milestone: "M8", created: "2026-08-25" },
    { id: 30, name: "EMR 电子病历 / 对比照：涉医疗文书合规（不可篡改+全程审计）、双签 RBAC、MinIO 图床，本阶段暂缓，详情页保留中文占位", status: "hold", priority: "P3", line: "交易域", owner: "全栈", milestone: "M7", created: "2026-09-01" },
    { id: 31, name: "审批中心 T3-01（M4 部分）：统一 approval_todo 表 + 退款/退卡审批闭环，L1/L2/L3 三级阈值 ¥1,000/5,000/20,000，approve/reject/transfer/addSigner 四动作 + history 链，审批中心页去 mock（2026-09-02 M4 验收）", status: "done", priority: "P1", line: "交易域", owner: "全栈", milestone: "M4", created: "2026-09-02" },
  ],

  stats: [
    { label: "工作项总数",   calc: items => items.length },
    { label: "已完成",       calc: items => items.filter(i => i.status === "done").length },
    { label: "待开始",       calc: items => items.filter(i => i.status === "todo").length },
    { label: "P0/P1 待办",   calc: items => items.filter(i => i.status !== "done" && i.status !== "hold" && (i.priority === "P0" || i.priority === "P1")).length },
    { label: "暂缓",         calc: items => items.filter(i => i.status === "hold").length },
  ],
};

const store = {
  load() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return structuredClone(CONFIG.seed);
  },
  save(items) { localStorage.setItem(CONFIG.storageKey, JSON.stringify(items)); },
};

let items = store.load();
let currentView = "table";

const $ = sel => document.querySelector(sel);
const statusOf = k => CONFIG.statuses.find(s => s.key === k) || { label: k, color: "#eee", text: "#333" };
const prioOf = k => CONFIG.priorities.find(p => p.key === k) || { key: k, color: "#eee", text: "#333" };

function filtered() {
  const s = $("#filter-status").value, p = $("#filter-priority").value, l = $("#filter-line").value, q = $("#search").value.trim().toLowerCase();
  return items.filter(i =>
    (!s || i.status === s) && (!p || i.priority === p) && (!l || i.line === l) &&
    (!q || (i.name || "").toLowerCase().includes(q) || (i.line || "").toLowerCase().includes(q))
  );
}

function renderStats() {
  $("#stats").innerHTML = CONFIG.stats.map(s =>
    `<div class="stat"><div class="label">${s.label}</div><div class="value">${s.calc(items)}</div></div>`
  ).join("");
}

function cell(item, col) {
  const v = item[col.key] ?? "";
  if (col.type === "status") { const s = statusOf(v); return `<span class="badge" style="background:${s.color};color:${s.text}"><span class="dot"></span>${s.label}</span>`; }
  if (col.type === "priority") { const p = prioOf(v); return `<span class="badge" style="background:${p.color};color:${p.text}">${p.key}</span>`; }
  return v;
}

const TRASH_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><line x1="10" y1="10" x2="10" y2="17"/><line x1="14" y1="10" x2="14" y2="17"/></svg>`;

function renderTable() {
  $("#thead-row").innerHTML = CONFIG.columns.map(c => `<th>${c.label}</th>`).join("") + `<th class="col-actions">操作</th>`;
  $("#tbody").innerHTML = filtered().map(item =>
    `<tr data-id="${item.id}">` +
    CONFIG.columns.map(c => `<td class="${c.key === "name" ? "name" : ""}">${cell(item, c)}</td>`).join("") +
    `<td class="col-actions"><button class="icon-btn js-del" title="删除">${TRASH_SVG}</button></td>` +
    `</tr>`
  ).join("");
  $("#tbody").querySelectorAll("td.name").forEach(td =>
    td.onclick = () => openModal(items.find(i => i.id == td.parentElement.dataset.id)));
  $("#tbody").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest("tr").dataset.id)); });
}

function renderBoard() {
  const data = filtered();
  $("#view-board").innerHTML = CONFIG.statuses.map(s => {
    const list = data.filter(i => i.status === s.key);
    return `<div class="col" data-status="${s.key}">
      <h3>${s.label}<span class="count">${list.length}</span></h3>
      <div class="col-body">${list.map(ticketHTML).join("")}</div>
    </div>`;
  }).join("");
  wireDnD();
}

function ticketHTML(item) {
  const p = prioOf(item.priority);
  return `<div class="ticket" draggable="true" data-id="${item.id}">
    <button class="icon-btn js-del t-del" title="删除">${TRASH_SVG}</button>
    <div class="t-name">${item.name}</div>
    <div class="t-meta">
      <span class="badge" style="background:${p.color};color:${p.text}">${p.key}</span>
      <span>${item.line || "未分域"}</span>
      <span>· ${item.owner || "未定"}</span>
    </div></div>`;
}

function wireDnD() {
  let dragId = null;
  $("#view-board").querySelectorAll(".ticket").forEach(t => {
    t.ondragstart = () => { dragId = t.dataset.id; t.classList.add("dragging"); };
    t.ondragend = () => t.classList.remove("dragging");
    t.onclick = () => openModal(items.find(i => i.id == t.dataset.id));
  });
  $("#view-board").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest(".ticket").dataset.id)); });
  $("#view-board").querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop-hover"); };
    col.ondragleave = () => col.classList.remove("drop-hover");
    col.ondrop = () => {
      col.classList.remove("drop-hover");
      const item = items.find(i => i.id == dragId);
      if (item) { item.status = col.dataset.status; persist(); }
    };
  });
}

function render() {
  renderStats();
  $("#view-table").classList.toggle("hidden", currentView !== "table");
  $("#view-board").classList.toggle("hidden", currentView !== "board");
  currentView === "table" ? renderTable() : renderBoard();
}
function persist() { store.save(items); render(); }

function openModal(item) {
  const editing = !!item;
  const d = item || { id: Date.now(), name: "", status: CONFIG.statuses[0].key, owner: "", priority: CONFIG.priorities.at(-1).key, line: "", milestone: "", created: new Date().toISOString().slice(0, 10) };
  const opts = (arr, sel, lab = x => x.label || x.key, val = x => x.key) =>
    arr.map(x => `<option value="${val(x)}" ${val(x) === sel ? "selected" : ""}>${lab(x)}</option>`).join("");
  const lines = [...new Set(CONFIG.seed.map(i => i.line))];
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <h2>${editing ? "编辑工作项" : "新建工作项"}</h2>
    <div class="sub">${editing ? "修改后点击保存生效" : "填写信息创建一条新的工作项"}</div>
    <div class="field"><label>工作项名称</label><input id="m-name" value="${d.name.replace(/"/g, "&quot;")}" placeholder="输入工作项名称" /></div>
    <div class="field"><label>业务域</label><input id="m-line" list="line-opts" value="${d.line || ""}" placeholder="如 客户域/交易域/基础设施" /><datalist id="line-opts">${lines.map(l => `<option value="${l}">`).join("")}</datalist></div>
    <div class="field"><label>负责层</label><input id="m-owner" value="${d.owner || ""}" placeholder="前端/后端/全栈/DevOps/测试" /></div>
    <div class="field"><label>里程碑</label><input id="m-milestone" value="${d.milestone || ""}" placeholder="如 M4 / M7" /></div>
    <div class="field"><label>状态</label><select id="m-status">${opts(CONFIG.statuses, d.status)}</select></div>
    <div class="field"><label>优先级</label><select id="m-priority">${opts(CONFIG.priorities, d.priority)}</select></div>
    <div class="modal-actions">
      ${editing ? '<button class="link-danger" id="m-del">删除</button>' : ""}
      <div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-save">保存</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector("#m-save").onclick = () => {
    d.name = overlay.querySelector("#m-name").value.trim() || "未命名";
    d.owner = overlay.querySelector("#m-owner").value.trim();
    d.line = overlay.querySelector("#m-line").value.trim();
    d.milestone = overlay.querySelector("#m-milestone").value.trim();
    d.status = overlay.querySelector("#m-status").value;
    d.priority = overlay.querySelector("#m-priority").value;
    if (!editing) items.unshift(d);
    persist(); close();
  };
  if (editing) overlay.querySelector("#m-del").onclick = () => { close(); confirmDelete(d); };
}

function confirmDelete(item) {
  if (!item) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:380px">
    <h2>删除工作项</h2>
    <div class="sub">确定删除「${item.name}」？此操作不可撤销。</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">取消</button>
      <button class="btn danger" id="c-ok">删除</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#c-cancel").onclick = close;
  overlay.querySelector("#c-ok").onclick = () => { items = items.filter(i => i.id !== item.id); persist(); close(); };
}

function initFilters() {
  $("#filter-status").insertAdjacentHTML("beforeend", CONFIG.statuses.map(s => `<option value="${s.key}">${s.label}</option>`).join(""));
  $("#filter-priority").insertAdjacentHTML("beforeend", CONFIG.priorities.map(p => `<option value="${p.key}">${p.key}</option>`).join(""));
  $("#filter-line").insertAdjacentHTML("beforeend", [...new Set(CONFIG.seed.map(i => i.line))].map(l => `<option value="${l}">${l}</option>`).join(""));
}
document.querySelectorAll(".tab").forEach(tab =>
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentView = tab.dataset.view;
    render();
  });
["#filter-status", "#filter-priority", "#filter-line", "#search"].forEach(sel => $(sel).oninput = render);
$("#btn-new").onclick = () => openModal(null);

initFilters();
render();
</script>
</body>
</html>
