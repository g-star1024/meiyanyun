server:
  port: 8083

spring:
  application:
    name: txn-service
  datasource:
    url: jdbc:postgresql://localhost:5433/meiyun_core
    username: meiyun
    password: meiyun123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# audit-service 地址（append-only 审计链写入入口）
audit:
  service:
    url: ${AUDIT_SERVICE_URL:http://localhost:8084}

# finance-service 地址（B3 合规写：资金事件 outbox 投递落账入口）
finance:
  service:
    url: ${FINANCE_SERVICE_URL:http://localhost:8087}

# org-service 地址（P5-B57 卡2：外部依赖配置窗口 60s 快照拉取，系统身份 X-Internal-Token）
org:
  service:
    url: ${ORG_SERVICE_URL:http://127.0.0.1:8086}

meiyun:
  # 通知全局免打扰运维默认兜底（P5-B60 卡4）：管理端配置窗 NOTIFY_GLOBAL_QUIET
  # 启用时由 60s 快照覆盖本段；本段仅在配置窗禁用/不可用时生效。
  notify:
    quiet:
      enabled: ${MEIYUN_NOTIFY_QUIET_ENABLED:false}
      start: ${MEIYUN_NOTIFY_QUIET_START:22:00}
      end: ${MEIYUN_NOTIFY_QUIET_END:08:00}
    # dev 网关 webhook 中继兜底（直连未开启时生效；配置窗口 NOTIFY_*_GATEWAY 启用值优先）
    gateway:
      sms-url: ${MEIYUN_NOTIFY_SMS_GATEWAY_URL:}
      email-url: ${MEIYUN_NOTIFY_EMAIL_GATEWAY_URL:}
      wechat-url: ${MEIYUN_NOTIFY_WECHAT_GATEWAY_URL:}
    # 棒⑧卡1 三通道直连官方 API env 兜底：配置窗口 NOTIFY_*_DIRECT（SWITCH+configJson）
    # 与 NOTIFY_*_SECRET（AES-GCM 密文）启用值优先；本段仅在配置窗未启用时生效。
    # 直连开启但厂商参数/密钥/员工联系方式任一缺失 → SKIPPED 诚实降级，不回落 webhook 中继。
    direct:
      sms-enabled: ${MEIYUN_NOTIFY_SMS_DIRECT_ENABLED:false}
      sms-config: ${MEIYUN_NOTIFY_SMS_DIRECT_CONFIG:}
      sms-secret: ${MEIYUN_NOTIFY_SMS_DIRECT_SECRET:}
      email-enabled: ${MEIYUN_NOTIFY_EMAIL_DIRECT_ENABLED:false}
      email-config: ${MEIYUN_NOTIFY_EMAIL_DIRECT_CONFIG:}
      email-secret: ${MEIYUN_NOTIFY_EMAIL_DIRECT_SECRET:}
      wechat-enabled: ${MEIYUN_NOTIFY_WECHAT_DIRECT_ENABLED:false}
      wechat-config: ${MEIYUN_NOTIFY_WECHAT_DIRECT_CONFIG:}
      wechat-secret: ${MEIYUN_NOTIFY_WECHAT_DIRECT_SECRET:}
  security:
    # 生产经环境变量注入；dev 默认值仅供本地联调
    secret: ${MEIYUN_JWT_SECRET:meiyun-dev-jwt-secret-please-change-in-prod-0123456789}
    internal-token: ${MEIYUN_INTERNAL_TOKEN:meiyun-dev-internal-token-please-change-in-prod}
    dev-login: ${MEIYUN_DEV_LOGIN:false}
    # public-paths 整体覆盖默认列表，须显式带全默认公共路径
    public-paths:
      - /api/org/auth/login
      - /api/org/auth/dev-login
      - /actuator/health
      - /error

logging:
  level:
    com.meiyun: INFO
