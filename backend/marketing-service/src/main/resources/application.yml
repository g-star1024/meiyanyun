server:
  port: 8088

spring:
  application:
    name: marketing-service
  # 棒⑧卡4：海报渲染产物上传（Boot 默认单文件上限 1MB 不足，放开到与端点校验同口径 10MB）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:postgresql://localhost:5433/meiyun_core?stringtype=unspecified
    username: meiyun
    password: meiyun123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # B48 卡3 收口 update→validate：18 张域表已全部 Flyway 纳管（V11-V14），
      # 实体与现网物理结构一致（历史表本由 JPA 建出、push_type 手工 ALTER 与实体 length=16 对齐），
      # 启动校验替代自动建表/补列，杜绝 schema 静默漂移；后续结构变更一律走新 Flyway 迁移。
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 现网 marketing 域表历史全部由 JPA ddl-auto=update 建出：baseline-version=0 标记历史基线，
    # V11 起新增/校准走迁移；DDL 全部 CREATE TABLE IF NOT EXISTS，迁移后 Hibernate validate 仅校验不改表。
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "JPA 自动建表基线"
    table: flyway_schema_history
    validate-on-migrate: true
    # P5-B52 卡1：全库共享 flyway_schema_history，seed 库多服务先后初始化时 ai(V15-V29)/audit(V30/V31)
    # 已先于 marketing 应用，marketing 本地 V11-V14 成为低版本 pending，默认校验直接失败致服务 Exited(1)。
    # 放行乱序补应用（B38 audit 同款先例）；V11-V14 全部 CREATE TABLE IF NOT EXISTS，补跑幂等安全。
    out-of-order: true
    # 全库共享 flyway_schema_history：customer 持 V1/V2/V3/V5/V9、finance 持 V4/V6/V7/V8、
    # audit 持 V10/V30/V31，marketing 类路径持 V11-V14。他服务脚本缺失分两种状态，均须忽略：
    #   missing = 已应用但本地缺失且版本早于本地最新迁移；future = 已应用但本地缺失且版本更新；
    # 显式配置 patterns 后默认 ignoreFutureMigrations 被覆盖，故两个状态都要列。
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"

  # 棒⑥卡5 三轨真验修复：显式注册违禁词缓存名。classpath 含 spring-boot-starter-data-redis 时
  # Boot 自动配置 RedisCacheManager；Spring Data Redis 3.2 起 builder 默认 disableCreateOnMissingCache
  # （不再运行时动态建 cache），未注册的 cache 名调用即抛 Cannot find cache named 'forbiddenWords'，
  # 致营销域全部违禁词校验写路径 500。全服务 @Cacheable 仅此一处同名，显式注册后启动即建。
  cache:
    cache-names: forbiddenWords
  # Redis：违禁词库缓存（@Cacheable）常驻使用；rate-limiter=redis 时兼用于触达频控。
  # Lettuce 懒连接，本机无 Redis 也不影响服务启动；密码经环境变量注入（与中间件 requirepass 一致）。
  data:
    redis:
      host: localhost
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s

# 中间件接入开关（Phase 2 docker-compose 就绪后改 redis / mq 即无缝切换）：
#   rate-limiter:    db（默认，查 push_record 表计数）| redis（原子 INCR+EXPIRE，多实例共享）
#   event-publisher: log（默认，写日志）| mq（投递 MQ，由 MqDomainEventPublisher 实现）
meiyun:
  rate-limiter: ${MEIYUN_RATE_LIMITER:db}
  event-publisher: ${MEIYUN_EVENT_PUBLISHER:log}
  # 棒⑧卡2：客户侧营销推送短信直连（与 txn 员工侧同键同语义；org integration_config 库行优先，env 兜底）
  notify:
    direct:
      sms-enabled: ${MEIYUN_NOTIFY_SMS_DIRECT_ENABLED:false}
      sms-config: ${MEIYUN_NOTIFY_SMS_DIRECT_CONFIG:}
      sms-secret: ${MEIYUN_NOTIFY_SMS_SECRET:}
  # 棒⑧卡4：对象存储直连（S3/MinIO 接入位；org integration_config 目录 STORAGE_DIRECT/STORAGE_SECRET
  # 库行优先，此处 env 为库外兜底）。未启用走本地磁盘兜底 storage.local.root；启用缺参渲染上传
  # SKIPPED 503 中文诚实降级，不静默回落 local。config 为 JSON 五字段：provider/endpoint/bucket/region/accessKey。
  storage:
    direct:
      enabled: ${MEIYUN_STORAGE_DIRECT_ENABLED:false}
      config: ${MEIYUN_STORAGE_DIRECT_CONFIG:}
      secret: ${MEIYUN_STORAGE_DIRECT_SECRET:}
  # 棒⑧卡5：Kafka 事件发布直连（接入位；org integration_config 目录 KAFKA_DIRECT/KAFKA_SECRET
  # 库行优先，此处 env 为库外兜底）。meiyun.event-publisher=mq 时由 KafkaDomainEventPublisher @Primary
  # 接管；KAFKA_DIRECT 未启用即使 mq 模式也如实降级 Logging 口径、不伪造已发送。config 为 JSON
  # 两字段：bootstrapServers/clientIdPrefix；secret 为 SASL JAAS 配置串（PLAINTEXT 内网直连留空）。
  kafka:
    direct:
      enabled: ${MEIYUN_KAFKA_DIRECT_ENABLED:false}
      config: ${MEIYUN_KAFKA_DIRECT_CONFIG:}
      secret: ${MEIYUN_KAFKA_DIRECT_SECRET:}
  security:
    # 生产经环境变量注入；dev 默认值仅供本地联调
    secret: ${MEIYUN_JWT_SECRET:meiyun-dev-jwt-secret-please-change-in-prod-0123456789}
    internal-token: ${MEIYUN_INTERNAL_TOKEN:meiyun-dev-internal-token-please-change-in-prod}
    dev-login: ${MEIYUN_DEV_LOGIN:false}
    # public-paths 整体覆盖默认列表，须显式带全默认公共路径
    # P5-B98：/api/public/landing/** 落地页公开采集端点（visit|lead 免鉴权，限流+幂等见 PublicLandingController）
    # 棒⑥卡5（L160②）：/api/public/poster/** 海报漏斗公开采集端点（track 免鉴权，限流+幂等见 PosterTrackController）
    public-paths:
      - /api/org/auth/login
      - /api/org/auth/dev-login
      - /actuator/health
      - /error
      - /api/public/landing/**
      - /api/public/poster/**

# org-service 地址（P5-B57 卡2：外部依赖配置窗口 60s 快照拉取——三渠道 HMAC 密钥/免签开关）
org:
  service:
    url: ${ORG_SERVICE_URL:http://127.0.0.1:8086}

logging:
  level:
    com.meiyun: INFO
