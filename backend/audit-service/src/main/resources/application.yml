server:
  port: 8084

spring:
  application:
    name: audit-service
  datasource:
    url: jdbc:postgresql://localhost:5433/meiyun_core?stringtype=unspecified
    username: meiyun
    password: meiyun123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway 先于 Hibernate 执行（V10 用 ALTER TABLE IF EXISTS 兼容全新库时序），update 迁移后 no-op 补列
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 现网库 audit_log 历史由 JPA 建表 + 两次手动 ALTER：baseline-version=0 标记历史基线，V10 正常执行
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "JPA 自动建表基线"
    table: flyway_schema_history
    validate-on-migrate: true
    # 全库共享 flyway_schema_history：customer 持 V1/V2/V3/V5/V9、finance 持 V4/V6/V7/V8，
    # audit 类路径仅持 V10。他服务脚本缺失分两种状态，均须忽略（与 customer/finance 对齐）：
    #   missing = 已应用但本地缺失且版本早于本地最新迁移；future = 已应用但本地缺失且版本更新；
    # 显式配置 patterns 后默认 ignoreFutureMigrations 被覆盖，故两个状态都要列。
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"
    # 共享链补洞：若 V11（marketing）先于本服务 V10 部署应用，允许 V10 乱序补执行，不被高版本占位卡死。
    out-of-order: true

meiyun:
  security:
    # 生产经环境变量注入；dev 默认值仅供本地联调
    secret: ${MEIYUN_JWT_SECRET:meiyun-dev-jwt-secret-please-change-in-prod-0123456789}
    internal-token: ${MEIYUN_INTERNAL_TOKEN:meiyun-dev-internal-token-please-change-in-prod}
    dev-login: ${MEIYUN_DEV_LOGIN:false}
    # public-paths 整体覆盖默认列表，须显式带全默认公共路径
    public-paths:
      - /api/org/auth/login
      - /api/org/auth/dev-login
      - /actuator/health
      - /error

logging:
  level:
    com.meiyun: INFO
