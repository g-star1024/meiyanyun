server:
  port: 8082

spring:
  application:
    name: customer-service
  datasource:
    # 宿主机映射端口 5433；stringtype=unspecified 规避 jsonb/varchar 绑定问题
    url: jdbc:postgresql://localhost:5433/meiyun_core?stringtype=unspecified
    username: meiyun
    password: meiyun123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway 负责精管表（sys_*、字典种子），Hibernate 用 update 在迁移后补齐实体派生表
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 现有库已由 JPA 建表：对已有库做 baseline（标记基线），V1/V2 仍会被纳入并执行
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: "JPA 自动建表基线"
    table: flyway_schema_history
    validate-on-migrate: true
    # 全库共享 flyway_schema_history：finance-service 持有 V4（finance fund entry），customer 类路径
    # 不持有该脚本；共享库约定忽略他服务迁移的两种缺失状态（与 finance-service 对齐）：
    #   missing = 已应用但本地缺失且版本早于本地最新迁移（如 finance 的 V4，低于 customer 的 V5）；
    #   future  = 已应用但本地缺失且版本新于本地最新迁移（finance 后续新增高版本迁移时命中）；
    # 显式配置 patterns 后默认 ignoreFutureMigrations 被覆盖，故两个状态都要列。
    # customer 自己的迁移仍严格校验（checksum/类型错误不匹配这两个通配状态）。
    ignore-migration-patterns:
      - "*:missing"
      - "*:future"

# 跨服务地址（容器内由 *_SERVICE_URL 注入服务名寻址；本地默认回环）
finance:
  service:
    url: ${FINANCE_SERVICE_URL:http://localhost:8087}
txn:
  service:
    # 消费自动积分引擎拉取已收款/已退款订单的只读内部端点（txn-service InternalOrderController）
    url: ${TXN_SERVICE_URL:http://localhost:8083}

# ES 客户全文检索（JDK HttpClient 直连，零客户端依赖；不可用时自动降级 DB 过滤）
meiyun:
  es:
    endpoint: ${MEIYUN_ES_ENDPOINT:http://localhost:9200}
  security:
    # 生产经环境变量注入；dev 默认值仅供本地联调
    secret: ${MEIYUN_JWT_SECRET:meiyun-dev-jwt-secret-please-change-in-prod-0123456789}
    internal-token: ${MEIYUN_INTERNAL_TOKEN:meiyun-dev-internal-token-please-change-in-prod}
    dev-login: ${MEIYUN_DEV_LOGIN:false}
    # public-paths 整体覆盖默认列表，须显式带全默认公共路径
    public-paths:
      - /api/org/auth/login
      - /api/org/auth/dev-login
      - /actuator/health
      - /error
      # 注：/api/customer/mall/exchange 已收回登录态内（points:view 门槛 + customerId 存在性校验）。
      # C 端小程序兑换待会员独立 token 体系上线后再开放匿名/会员通道，不在此白名单。

logging:
  level:
    com.meiyun: INFO
