version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15
    container_name: meiyun-postgres
    environment:
      POSTGRES_DB: meiyun_core
      POSTGRES_USER: meiyun
      POSTGRES_PASSWORD: meiyun123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migration:/docker-entrypoint-initdb.d
    networks:
      - meiyun-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meiyun"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: meiyun-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meiyun-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO 对象存储（文件存储）
  minio:
    image: minio/minio:latest
    container_name: meiyun-minio
    environment:
      MINIO_ROOT_USER: meiyun
      MINIO_ROOT_PASSWORD: meiyun123
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - meiyun-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  meiyun-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
