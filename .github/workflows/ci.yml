name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# 美研云 Phase 1 CI：后端 Maven（编译+单测）、前端 pnpm（类型检查+构建）、Go 网关（编译+vet）。
# 红线：单测失败 / 编译失败 / 双签引擎与审计链测试不过 → 阻断合码。
jobs:
  backend:
    name: Backend (Java 17 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & test (meiyun-common + 3 services)
        # 先单独 install common 到本地仓库，再编译全部模块并跑单测
        run: |
          mvn -B -ntp -pl meiyun-common install
          mvn -B -ntp test

  frontend:
    name: Frontend (Node 22 / pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # pnpm 11 会在 run script 前做依赖预检，esbuild 的构建脚本被供应链策略忽略时会误判失败。
    # 该预检对已安装的 vite/esbuild 无影响，关闭即可。
    env:
      PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Type-check & build
        run: pnpm build

  gateway:
    name: GM Gateway (Go 1.26)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: gateway/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/meiyun-gm-gateway .
