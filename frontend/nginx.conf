# 前端生产反代：/api 与 /healthz 转发到国密网关（容器内地地址 gateway:8443）。
# 网关使用自签证书，关闭证书校验。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 大模型长耗时生成路由（真实出站，实测 60~120s）：代理超时放宽到 180s，
    # 与后端 LLM 读超时、前端 axios timeout(180000) 对齐，避免 nginx 60s 默认值提前 504。
    location ~ ^/api/ai/(daily/generate|churn/run|scheduling/generate)$ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SSE 长连路由（/api/**/stream：大屏成交流 / 站内通知流）：nginx 默认 proxy_buffering on
    # 会把事件攒在缓冲区不下发，浏览器 EventSource 永远收不到（curl 直连网关可收，经本反代不可收）。
    # 必须关缓冲/缓存 + HTTP/1.1 长连；read timeout 对齐 emitter 30min 生命周期放宽到 1h，
    # 超时后浏览器 EventSource 自动重连即可。
    location ~ ^/api/.+/stream$ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
    }
}
