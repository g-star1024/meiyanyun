# 前端生产反代：/api 与 /healthz 转发到国密网关（容器内地地址 gateway:8443）。
# 网关使用自签证书，关闭证书校验。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 大模型长耗时生成路由（真实出站，实测 60~120s）：代理超时放宽到 180s，
    # 与后端 LLM 读超时、前端 axios timeout(180000) 对齐，避免 nginx 60s 默认值提前 504。
    location ~ ^/api/ai/(daily/generate|churn/run)$ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass https://gateway:8443;
        proxy_ssl_verify off;
    }
}
